spring.application.name=paypal-sandbox-payments
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/payments?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:local-payments}
spring.sql.init.mode=always
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2s
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:8080/checkout/approved}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:8080/checkout/cancelled}
